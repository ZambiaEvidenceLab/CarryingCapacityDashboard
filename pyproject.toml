[project]
name = "cca"
version = "0.1.0"
description = "Carrying Capacity Assessment: district-level sector capacity scoring for Zambia"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pytest>=8.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
