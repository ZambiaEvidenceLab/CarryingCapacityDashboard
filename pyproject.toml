[project]
name = "cca"
version = "0.1.0"
description = "Carrying Capacity Assessment: district-level sector capacity scoring for Zambia"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pytest>=8.0",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "openpyxl>=3.1",
    "dash>=2.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
